<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0f0f0f;
  --surface: #1a1a1a;
  --surface2: #242424;
  --border: #333;
  --text: #e8e8e8;
  --text-dim: #888;
  --accent: #268154;
  --accent-glow: rgba(38, 129, 84, 0.3);
  --user-bubble: #1e3a2f;
  --claude-bubble: #1e1e2e;
  --danger: #c0392b;
}

html, body {
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100%;
  max-width: 640px;
  margin: 0 auto;
}

/* Header */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

header h1 {
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.3px;
}

header h1 span { color: var(--accent); }

.settings-btn {
  background: none;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  padding: 6px;
  border-radius: 8px;
  transition: color 0.2s, background 0.2s;
}
.settings-btn:hover { color: var(--text); background: var(--surface2); }

/* Conversation area */
#conversation {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  scroll-behavior: smooth;
}

.msg {
  max-width: 85%;
  padding: 10px 14px;
  border-radius: 16px;
  margin-bottom: 10px;
  font-size: 15px;
  line-height: 1.5;
  word-wrap: break-word;
  animation: fadeUp 0.2s ease-out;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.msg.user {
  margin-left: auto;
  background: var(--user-bubble);
  border-bottom-right-radius: 4px;
}

.msg.assistant {
  margin-right: auto;
  background: var(--claude-bubble);
  border-bottom-left-radius: 4px;
}

.msg-label {
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 3px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.typing-indicator {
  display: inline-flex;
  gap: 4px;
  padding: 4px 0;
}
.typing-indicator span {
  width: 6px; height: 6px;
  background: var(--text-dim);
  border-radius: 50%;
  animation: blink 1.2s infinite;
}
.typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink {
  0%, 60%, 100% { opacity: 0.3; }
  30% { opacity: 1; }
}

/* Controls */
#controls {
  padding: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

#status {
  font-size: 13px;
  color: var(--text-dim);
  min-height: 20px;
}

#mic-btn {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  border: 3px solid var(--accent);
  background: var(--surface);
  color: var(--accent);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  position: relative;
}

#mic-btn:active { transform: scale(0.95); }

#mic-btn.listening {
  background: var(--accent);
  color: white;
  animation: pulse 1.5s infinite;
}

#mic-btn.processing {
  border-color: var(--text-dim);
  color: var(--text-dim);
  cursor: wait;
}

@keyframes pulse {
  0% { box-shadow: 0 0 0 0 var(--accent-glow); }
  70% { box-shadow: 0 0 0 18px rgba(38, 129, 84, 0); }
  100% { box-shadow: 0 0 0 0 rgba(38, 129, 84, 0); }
}

#mic-btn svg { width: 28px; height: 28px; fill: currentColor; }

/* Settings modal */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 100;
  align-items: flex-end;
  justify-content: center;
}
.modal-overlay.open { display: flex; }

.modal {
  background: var(--surface);
  width: 100%;
  max-width: 640px;
  border-radius: 20px 20px 0 0;
  padding: 24px 20px 32px;
  animation: slideUp 0.25s ease-out;
  max-height: 85vh;
  overflow-y: auto;
}

@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

.modal h2 {
  font-size: 18px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.modal label {
  display: block;
  font-size: 13px;
  color: var(--text-dim);
  margin-bottom: 6px;
  margin-top: 16px;
}

.modal input, .modal select {
  width: 100%;
  padding: 10px 12px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-size: 15px;
  outline: none;
}
.modal input:focus, .modal select:focus {
  border-color: var(--accent);
}

.modal .note {
  font-size: 12px;
  color: var(--text-dim);
  margin-top: 4px;
  line-height: 1.4;
}

.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 16px;
}
.toggle-row span { font-size: 14px; }

.toggle {
  width: 44px; height: 24px;
  background: var(--border);
  border-radius: 12px;
  cursor: pointer;
  position: relative;
  transition: background 0.2s;
}
.toggle.on { background: var(--accent); }
.toggle::after {
  content: '';
  position: absolute;
  width: 18px; height: 18px;
  background: white;
  border-radius: 50%;
  top: 3px; left: 3px;
  transition: transform 0.2s;
}
.toggle.on::after { transform: translateX(20px); }

.close-btn {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 22px;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 6px;
}
.close-btn:hover { color: var(--text); }

.save-btn {
  width: 100%;
  margin-top: 24px;
  padding: 12px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}
.save-btn:hover { opacity: 0.9; }

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1><span>Voice</span> Claude</h1>
    <button class="settings-btn" onclick="openSettings()" aria-label="Settings">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <div id="conversation">
    <div class="msg assistant">
      <div class="msg-label">Claude</div>
      Hi! Tap the mic and start talking. I'll listen, respond, and speak back to you.
    </div>
  </div>

  <div id="controls">
    <div id="status">Tap mic to speak</div>
    <button id="mic-btn" onclick="toggleMic()">
      <svg viewBox="0 0 24 24"><path d="M12 1a4 4 0 0 0-4 4v6a4 4 0 0 0 8 0V5a4 4 0 0 0-4-4zm0 16a6 6 0 0 0 6-6h-2a4 4 0 0 1-8 0H6a6 6 0 0 0 5 5.91V20H8v2h8v-2h-3v-3.09A6 6 0 0 0 12 17z"/></svg>
    </button>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settings-overlay" onclick="closeSettingsOutside(event)">
  <div class="modal">
    <h2>Settings <button class="close-btn" onclick="closeSettings()">&times;</button></h2>

    <label for="inp-ollama-url">Ollama URL</label>
    <input type="text" id="inp-ollama-url" placeholder="https://your-tunnel.trycloudflare.com">
    <div class="note">Your Cloudflare tunnel URL pointing to Ollama on your Mac. Update if the URL changes.</div>

    <label for="inp-model">Model</label>
    <select id="inp-model">
      <option value="qwen2.5:7b">Qwen 2.5 7B</option>
      <option value="qwen3:8b">Qwen 3 8B</option>
      <option value="llama3.2:3b">Llama 3.2 3B (fastest)</option>
    </select>

    <label for="inp-voice">Voice (device built-in)</label>
    <select id="inp-voice">
      <option value="">Default voice</option>
    </select>
    <div class="note">Uses your device's built-in speech — no account needed.</div>

    <label for="inp-system">System Prompt (optional)</label>
    <input type="text" id="inp-system" placeholder="You are a helpful assistant...">

    <div class="toggle-row">
      <span>Enable TTS audio</span>
      <div class="toggle on" id="toggle-tts" onclick="toggleTTS()"></div>
    </div>

    <button class="save-btn" onclick="saveSettings()">Save</button>
  </div>
</div>

<script>
// ── State ──
let config = {
  voiceId: '21m00Tcm4TlvDq8ikWAM',
  model: "claude-sonnet-4-6",
  systemPrompt: 'You are a helpful, concise voice assistant. Keep responses short and conversational — ideally 1-3 sentences unless the user asks for detail.',
  useProxy: false,
  ttsEnabled: true
};

let conversationHistory = [];
let isListening = false;
let isProcessing = false;
let recognition = null;
let currentAudio = null;

const $ = id => document.getElementById(id);
const convo = $('conversation');
const micBtn = $('mic-btn');
const status = $('status');

// ── Speech Recognition Setup ──
function initRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    setStatus('Speech recognition not supported in this browser');
    micBtn.disabled = true;
    return;
  }
  recognition = new SR();
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.lang = 'en-US';

  let finalTranscript = '';
  let interimEl = null;

  recognition.onstart = () => {
    isListening = true;
    micBtn.classList.add('listening');
    micBtn.classList.remove('processing');
    setStatus('Listening...');
    finalTranscript = '';
    interimEl = addMessage('user', '', true);
  };

  recognition.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        finalTranscript += e.results[i][0].transcript;
      } else {
        interim += e.results[i][0].transcript;
      }
    }
    if (interimEl) {
      interimEl.querySelector('.msg-text').textContent = finalTranscript + interim;
      scrollToBottom();
    }
  };

  recognition.onend = () => {
    isListening = false;
    micBtn.classList.remove('listening');
    if (finalTranscript.trim()) {
      if (interimEl) interimEl.querySelector('.msg-text').textContent = finalTranscript.trim();
      processUserInput(finalTranscript.trim());
    } else {
      if (interimEl) interimEl.remove();
      setStatus('Tap mic to speak');
    }
  };

  recognition.onerror = (e) => {
    isListening = false;
    micBtn.classList.remove('listening');
    if (interimEl) interimEl.remove();
    if (e.error === 'not-allowed') {
      setStatus('Microphone access denied');
    } else if (e.error !== 'aborted') {
      setStatus('Error: ' + e.error);
    }
  };
}

// ── UI Helpers ──
function setStatus(text) { status.textContent = text; }

function addMessage(role, text, isInterim) {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.innerHTML = `<div class="msg-label">${role === 'user' ? 'You' : 'Claude'}</div><div class="msg-text">${text}</div>`;
  convo.appendChild(el);
  scrollToBottom();
  return el;
}

function addTypingIndicator() {
  const el = document.createElement('div');
  el.className = 'msg assistant';
  el.id = 'typing';
  el.innerHTML = `<div class="msg-label">Claude</div><div class="typing-indicator"><span></span><span></span><span></span></div>`;
  convo.appendChild(el);
  scrollToBottom();
  return el;
}

function removeTypingIndicator() {
  const el = $('typing');
  if (el) el.remove();
}

function scrollToBottom() {
  requestAnimationFrame(() => { convo.scrollTop = convo.scrollHeight; });
}

// ── Core Pipeline ──
async function processUserInput(text) {
  if (!config.ollamaUrl) {
    addMessage('assistant', 'Please set your Ollama URL in Settings.');
    setStatus('Tap mic to speak');
    return;
  }

  isProcessing = true;
  micBtn.classList.add('processing');

  conversationHistory.push({ role: 'user', content: text });
  addTypingIndicator();
  setStatus('Thinking...');

  try {
    const reply = await callClaude(conversationHistory);
    removeTypingIndicator();
    conversationHistory.push({ role: 'assistant', content: reply });
    addMessage('assistant', formatText(reply));

    if (config.ttsEnabled) {
      setStatus('Speaking...');
      await playTTS(reply);
    }
    setStatus('Tap mic to speak');
  } catch (err) {
    removeTypingIndicator();
    addMessage('assistant', 'Error: ' + err.message);
    setStatus('Error occurred');
    console.error(err);
  }

  isProcessing = false;
  micBtn.classList.remove('processing');
}

function formatText(text) {
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

// ── Ollama API ──
async function callClaude(messages) {
  const url = config.ollamaUrl.replace(/\/+$/, '') + '/api/chat';

  // Build messages array with system prompt prepended
  const ollamaMessages = [];
  if (config.systemPrompt) {
    ollamaMessages.push({ role: 'system', content: config.systemPrompt });
  }
  messages.forEach(m => ollamaMessages.push({ role: m.role, content: m.content }));

  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: config.model,
      messages: ollamaMessages,
      stream: false
    })
  });

  if (!res.ok) {
    const err = await res.text();
    throw new Error(`Ollama ${res.status}: ${err}`);
  }

  const data = await res.json();
  return data.message.content;
}

// ── Web Speech TTS ──
function populateVoices() {
  const sel = document.getElementById('inp-voice');
  const voices = speechSynthesis.getVoices();
  // Keep the default option, add device voices
  while (sel.options.length > 1) sel.remove(1);
  voices.forEach((v, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = v.name + (v.localService ? ' ✓' : '');
    if (v.default) opt.selected = true;
    sel.appendChild(opt);
  });
}

if (typeof speechSynthesis !== 'undefined') {
  speechSynthesis.onvoiceschanged = populateVoices;
  populateVoices();
}

function stopSpeech() {
  if (typeof speechSynthesis !== 'undefined') {
    speechSynthesis.cancel();
  }
}

async function playTTS(text) {
  if (typeof speechSynthesis === 'undefined') return;
  return new Promise((resolve) => {
    speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    utt.rate = 1.05;
    utt.pitch = 1.0;
    // Apply selected voice if set
    const sel = document.getElementById('inp-voice');
    const idx = parseInt(sel.value);
    if (!isNaN(idx)) {
      const voices = speechSynthesis.getVoices();
      if (voices[idx]) utt.voice = voices[idx];
    }
    utt.onend = resolve;
    utt.onerror = resolve;
    speechSynthesis.speak(utt);
  });
}

// ── Mic Toggle ──
function toggleMic() {
  if (isProcessing) return;
  if (isListening) {
    recognition.stop();
  } else {
    stopSpeech();
    try { recognition.start(); } catch(e) { /* already started */ }
  }
}

// ── Settings ──
function openSettings() {
  $('inp-ollama-url').value = config.ollamaUrl;
  populateVoices();
  $('inp-model').value = config.model;
  $('inp-system').value = config.systemPrompt;
  $('toggle-tts').classList.toggle('on', config.ttsEnabled);
  $('settings-overlay').classList.add('open');
}

function closeSettings() { $('settings-overlay').classList.remove('open'); }

function closeSettingsOutside(e) { if (e.target === $('settings-overlay')) closeSettings(); }

function toggleTTS() { $('toggle-tts').classList.toggle('on'); }

function saveSettings() {
  config.ollamaUrl = $('inp-ollama-url').value.trim();
  config.voiceId = $('inp-voice').value;
  config.model = $('inp-model').value;
  config.systemPrompt = $('inp-system').value.trim();
  config.ttsEnabled = $('toggle-tts').classList.contains('on');
  closeSettings();
  setStatus(config.ollamaUrl ? 'Tap mic to speak' : 'Set Ollama URL in Settings');
}

// ── Service Worker Registration ──
const SW_CODE = `
self.addEventListener('install', e => { self.skipWaiting(); });
self.addEventListener('activate', e => { e.waitUntil(clients.claim()); });
self.addEventListener('fetch', e => {
  if (e.request.url.includes('/api/')) return;
  e.respondWith(
    caches.match(e.request).then(r => r || fetch(e.request).then(resp => {
      const clone = resp.clone();
      caches.open('voice-claude-v1').then(c => c.put(e.request, clone));
      return resp;
    }))
  );
});
`;

function registerSW() {
  if ('serviceWorker' in navigator) {
    const blob = new Blob([SW_CODE], { type: 'application/javascript' });
    const url = URL.createObjectURL(blob);
    navigator.serviceWorker.register(url).catch(() => {});
  }
}

// ── Init ──
initRecognition();
registerSW();

// Keyboard shortcut: Space to toggle mic
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && e.target === document.body) {
    e.preventDefault();
    toggleMic();
  }
});
</script>
</body>
